name: Qualitätsprüfung

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust-wasm-web:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Rust installieren
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.97.1
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      - name: wasm-pack installieren
        uses: taiki-e/install-action@8561830551f57056c14ace724f164bcae2d227c2 # wasm-pack

      - name: Node.js installieren
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm

      - name: Formatierung prüfen
        run: cargo fmt --check

      - name: Clippy prüfen
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Rust-Tests ausführen
        run: cargo test --locked

      - name: WebAssembly bauen
        run: wasm-pack build --target web --out-dir web/pkg

      - name: Webstruktur prüfen
        run: python3 scripts/verify_web.py

      - name: JavaScript-Syntax prüfen
        run: find web/js -name '*.js' -type f -print0 | xargs -0 -n1 node --check

      - name: Browser-Abhängigkeiten installieren
        run: npm ci

      - name: Chromium installieren
        run: npx playwright install --with-deps chromium

      - name: Browser- und WCAG-Tests ausführen
        run: npm run test:e2e

      - name: Browser-Testbericht bei Fehlern sichern
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: playwright-bericht
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7
