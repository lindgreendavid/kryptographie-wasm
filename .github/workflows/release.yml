name: Release veröffentlichen

on:
    workflow_dispatch:

permissions:
    contents: write

concurrency:
    group: release
    cancel-in-progress: false

jobs:
    release:
        runs-on: ubuntu-latest
        steps:
            - name: Repository vollständig auschecken
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  fetch-depth: 0

            - name: Versionsangaben prüfen
              id: version
              run: |
                  cargo_version="$(awk -F '"' '/^version = / { print $2; exit }' Cargo.toml)"
                  lock_version="$(awk -F '"' '/^name = "krypto-wasm"/ { getline; print $2; exit }' Cargo.lock)"
                  npm_version="$(jq -r .version package.json)"

                  test -n "$cargo_version"
                  test "$cargo_version" = "$lock_version"
                  test "$cargo_version" = "$npm_version"
                  test -f "docs/release-notes-v$cargo_version.md"

                  echo "version=$cargo_version" >> "$GITHUB_OUTPUT"
                  echo "tag=v$cargo_version" >> "$GITHUB_OUTPUT"

            - name: Release-Tag anlegen
              env:
                  RELEASE_TAG: ${{ steps.version.outputs.tag }}
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

                  if ! git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
                    git tag -a "$RELEASE_TAG" "$GITHUB_SHA" -m "Kryptographie-WASM $RELEASE_TAG"
                    git push origin "refs/tags/$RELEASE_TAG"
                  fi

            - name: GitHub-Release anlegen
              env:
                  GH_TOKEN: ${{ github.token }}
                  RELEASE_TAG: ${{ steps.version.outputs.tag }}
                  RELEASE_VERSION: ${{ steps.version.outputs.version }}
              run: |
                  if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
                    gh release create "$RELEASE_TAG" \
                      --title "Kryptographie-WASM $RELEASE_VERSION" \
                      --notes-file "docs/release-notes-v$RELEASE_VERSION.md" \
                      --verify-tag
                  fi
