name: GitHub Pages

on:
    push:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: pages
    cancel-in-progress: true

jobs:
    build-and-deploy:
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        runs-on: ubuntu-latest
        steps:
            - name: Repository auschecken
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

            - name: Rust installieren
              uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
              with:
                  toolchain: 1.97.1
                  targets: wasm32-unknown-unknown

            - name: wasm-pack installieren
              uses: taiki-e/install-action@8561830551f57056c14ace724f164bcae2d227c2 # wasm-pack
              with:
                  tool: wasm-pack@0.14.0

            - name: WebAssembly für die Veröffentlichung bauen
              run: wasm-pack build --release --target web --out-dir web/pkg --locked

            - name: Webstruktur prüfen
              run: python3 scripts/verify_web.py

            - name: GitHub Pages konfigurieren
              uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
              with:
                  enablement: true

            - name: Seitenartefakt hochladen
              uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
              with:
                  path: web

            - name: Veröffentlichen
              id: deployment
              uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
