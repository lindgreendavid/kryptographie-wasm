[package]
name = "krypto-wasm"
version = "1.2.0"
edition = "2021"
rust-version = "1.97"
description = "Didaktische Kryptographie-Webanwendung mit Rust und WebAssembly"
repository = "https://github.com/lindgreendavid/kryptographie-wasm"
homepage = "https://lindgreendavid.github.io/kryptographie-wasm/"
license-file = "LICENSE"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
aes-gcm = "0.10"
base64 = "0.22"
chacha20poly1305 = "0.10"
getrandom = { version = "0.2", features = ["js"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
