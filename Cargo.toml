[package]
name = "krypto-wasm"
version = "0.1.0"
edition = "2021"
description = "Didaktische Kryptographie-Webanwendung mit Rust und WebAssembly"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
aes-gcm = "0.10"
base64 = "0.22"
getrandom = { version = "0.2", features = ["js"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"
